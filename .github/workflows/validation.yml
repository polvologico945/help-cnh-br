name: Validacao do PWA

on:
  push:
    branches:
      - feat/experimentos-percurso-virtual
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar aplicacao
        run: npm run build
      - name: Conferir tipos TypeScript
        run: npx tsc --noEmit
      - name: Verificar codigo
        run: npm run lint
