name: Formatacao unica do codigo existente

on:
  push:
    branches:
      - feat/experimentos-percurso-virtual

permissions:
  contents: write

jobs:
  formatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experimentos-percurso-virtual
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Aplicar formatacao sem mudar comportamento
        run: |
          npx prettier --write \
            src/components/GearShifter.tsx \
            src/components/OnboardingModal.tsx \
            src/components/QrLinkPanel.tsx \
            src/components/SVGBoundary.tsx \
            src/lib/mock/api.ts \
            src/lib/password.ts \
            src/lib/security-notes.ts \
            src/routes/__root.tsx \
            src/routes/admin.tsx \
            src/routes/painel.tsx
      - name: Publicar formatacao somente na branch de trabalho
        run: |
          git diff --check
          git add -- \
            src/components/GearShifter.tsx \
            src/components/OnboardingModal.tsx \
            src/components/QrLinkPanel.tsx \
            src/components/SVGBoundary.tsx \
            src/lib/mock/api.ts \
            src/lib/password.ts \
            src/lib/security-notes.ts \
            src/routes/__root.tsx \
            src/routes/admin.tsx \
            src/routes/painel.tsx
          if git diff --cached --quiet; then
            echo "Arquivos ja estao formatados"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalizar formatacao preexistente"
          git push origin HEAD:feat/experimentos-percurso-virtual
