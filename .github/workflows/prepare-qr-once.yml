name: Preparar QR e padronizar arquivos (etapa unica)

on:
  push:
    branches:
      - feat/experimentos-percurso-virtual

permissions:
  contents: write

jobs:
  preparar:
    if: contains(github.event.head_commit.message, 'ci: initialize QR tooling')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/experimentos-percurso-virtual
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Atualizar dependencia do QR Code e lockfiles
        run: |
          npm install qrcode.react@4.2.0 --save-exact --package-lock-only
          bun install --lockfile-only
          npm ci
      - name: Aplicar formatacao oficial
        run: |
          npx prettier --write \
            src/routes/admin.tsx \
            src/routes/painel.tsx \
            src/routes/instrutor.tsx \
            src/components/QrLinkPanel.tsx \
            src/components/StudentWorkspace.tsx \
            src/lib/linking.ts \
            src/lib/linking-store.server.ts \
            src/lib/mock/api.ts \
            src/lib/mock/types.ts
      - name: Publicar arquivos preparados
        run: |
          git diff --check
          git add package.json package-lock.json bun.lock \
            src/routes/admin.tsx src/routes/painel.tsx src/routes/instrutor.tsx \
            src/components/QrLinkPanel.tsx src/components/StudentWorkspace.tsx \
            src/lib/linking.ts src/lib/linking-store.server.ts \
            src/lib/mock/api.ts src/lib/mock/types.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualizar lockfiles e formatar novas interfaces"
          git push origin HEAD:feat/experimentos-percurso-virtual
